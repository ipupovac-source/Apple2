<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lemmings — Friends Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #0a0a1a;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh; /* dynamic viewport height — shrinks with Safari toolbar */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 960px;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
    object-fit: contain;
  }

  /* Desktop info */
  #info-bar {
    color: #556677;
    text-align: center;
    padding: 4px;
    font-size: 11px;
  }

  @media (max-width: 768px) {
    #info-bar { display: none; }
    body { justify-content: flex-start; }
  }

  @media (orientation: portrait) and (max-width: 768px) {
    #rotate-hint {
      display: flex !important;
    }
  }

  #rotate-hint {
    display: none;
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(50,80,140,0.85);
    color: #cde;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
    animation: fadeHint 6s forwards;
  }

  @keyframes fadeHint {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
</div>
<div id="info-bar">
  Click lemming to assign ability &middot; 1-8 select &middot; +/- spawn rate &middot; P pause &middot; Space start
</div>
<div id="rotate-hint">Rotate to landscape for best experience</div>

<script src="lemmings.js"></script>
</body>
</html>
