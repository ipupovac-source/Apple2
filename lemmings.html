<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemmings — Friends Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #game-header {
    color: #aaccff;
    text-align: center;
    padding: 8px 0 4px 0;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  #game-container {
    position: relative;
    background: #000;
    border: 3px solid #334;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(50,80,180,0.3), inset 0 0 20px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  #info-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 6px 0;
    color: #88aacc;
    font-size: 13px;
    opacity: 0.8;
  }

  #info-bar span {
    color: #ccddff;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="game-header">Lemmings — Friends Edition</div>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
</div>
<div id="info-bar">
  <div>Click lemming to assign ability | <span>1-8</span> select ability | <span>+/-</span> spawn rate | <span>P</span> pause | <span>Space</span> start</div>
</div>

<script src="lemmings.js"></script>
</body>
</html>
