        <span class="moment-sum-count">${g.count}</span>
        <span style="color:var(--muted);font-size:11px;margin-left:4px">›</span>
      </div>`).join('')
    : `<div class="empty"><p>Nema ključnih trenutaka</p></div>`;

  sec.innerHTML = `
    <div class="reports-wrap">
      <h2>Statistike sesije</h2>
      <div class="reports-grid">
        <div class="report-card">
          <div class="report-card-hdr">📊 Promjena pozicija</div>
          <div class="report-card-body">${posHtml}</div>
        </div>
        <div class="report-card">
          <div class="report-card-hdr">📻 Radio aktivnost</div>
          <div class="report-card-body">${radioHtml}</div>
        </div>
        <div class="report-card">
          <div class="report-card-hdr">🏁 Pregled zastava i događaja</div>
          <div class="report-card-body">${momentHtml}</div>
        </div>
      </div>
    </div>`;
}

/* ── Modal ─────────────────────────────────────────────────────────── */
function openModal(html) {
  const modal = document.getElementById('detailModal');
  document.getElementById('modalContent').innerHTML = html;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  /* Stop any modal audio */
  for (const k in audios) {
    if (String(k).startsWith('mo-') && !audios[k].paused) {
      audios[k].pause();
    }
  }
  for (const k in audios) { if (String(k).startsWith('mo-')) delete audios[k]; }

  const modal = document.getElementById('detailModal');
  if (modal) modal.style.display = 'none';
  document.body.style.overflow = '';

  /* Clear chart highlight when closing via X or Escape */
  if (CS.highlighted) {
    CS.highlighted = null;
    drawChart(null);
    const legend = document.getElementById('legend');
    if (legend) legend.querySelectorAll('.legend-item').forEach(li => {
      li.classList.remove('hl', 'dim');
    });
  }
}

function handleModalBackdropClick(e) {
  if (e.target === document.getElementById('detailModal')) closeModal();
}

/* ── Driver detail modal ───────────────────────────────────────────── */
function showDriverDetail(dNum) {
  /* Clear old modal audios */
  for (const k in audios) { if (String(k).startsWith('mo-')) delete audios[k]; }

  const d      = allDriverMap[dNum] || CS.driverMap[dNum] || {};
  const abbr   = d.name_acronym || `#${dNum}`;
  const name   = d.full_name    || abbr;
  const team   = d.team_name    || '—';
  const color  = d.team_colour  ? `#${d.team_colour}` : '#888';
  const num    = d.driver_number || dNum;

  /* Position stats */
  let statStart = '—', statBest = '—', statEnd = '—';
  const posArr = CS.byDriver[dNum] || CS.byDriver[String(dNum)] || [];
  if (posArr.length) {
    statStart = `P${Math.round(posArr[0].pos)}`;
    statEnd   = `P${Math.round(posArr[posArr.length - 1].pos)}`;
    statBest  = `P${Math.round(Math.min(...posArr.map(p => p.pos)))}`;
  }

  /* Radio messages for this driver */
  const driverRadio = allRadio
    .filter(r => String(r.driver_number) === String(dNum))
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  const radioRows = driverRadio.map((r, i) => {
    const id = `mo-${i}`;
    return `
      <div style="padding:9px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="drv-badge" style="border-left-color:${color}">${escHtml(abbr)}</span>
          <span class="radio-ts">${fmtTs(r.date)}</span>
        </div>
        <div class="radio-player">
          <button class="play-btn" id="pb-${id}"
            onclick="togglePlay('${id}', '${escAttr(r.recording_url)}')"
            title="Reproduciraj">▶</button>
          <div class="progress-bar" onclick="seekTo(event, this, '${id}')">
            <div class="progress-fill" id="pf-${id}" style="width:0%"></div>
          </div>
          <span class="audio-dur" id="dur-${id}">0:00</span>
        </div>
      </div>`;
  }).join('');

  const radioSection = driverRadio.length
    ? `<div class="modal-section-hdr">📻 Radio poruke (${driverRadio.length})</div>
       <div class="modal-body">${radioRows}</div>`
    : `<div class="modal-section-hdr">📻 Radio poruke</div>
       <div class="empty" style="padding:20px"><p>Nema radio poruka</p></div>`;

  openModal(`
    <div class="modal-hdr">
      <div class="modal-color-bar" style="background:${color}"></div>
      <div class="modal-hdr-body">
        <div class="modal-hdr-title">${escHtml(name)}</div>
        <div class="modal-hdr-sub">#${escHtml(String(num))} &nbsp;·&nbsp; ${escHtml(team)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${posArr.length ? `
    <div class="modal-stats">
      <div class="modal-stat">
        <div class="modal-stat-val">${statStart}</div>
        <div class="modal-stat-lbl">Start</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-val" style="color:var(--green)">${statBest}</div>
        <div class="modal-stat-lbl">Najbolja</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-val">${statEnd}</div>
        <div class="modal-stat-lbl">Kraj</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-val">${driverRadio.length}</div>
        <div class="modal-stat-lbl">Radio</div>
      </div>
    </div>` : ''}
    ${radioSection}
  `);
}

/* ── Moment type modal ─────────────────────────────────────────────── */
function showMomentTypeDetail(label) {
  const filtered = allMoments.filter(m => classify(m).label === label);
  if (!filtered.length) return;

  const { icon } = classify(filtered[0]);

  const rows = filtered.map(m => {
    const lap    = m.lap_number ? `Krug ${m.lap_number}` : '';
    const detail = [lap, m.message].filter(Boolean).join(' · ');
    return `
      <div class="modal-moment-row">
        <span class="modal-moment-icon">${icon}</span>
        <div class="modal-moment-body">
          ${lap ? `<div class="modal-moment-lap">${escHtml(lap)}</div>` : ''}
          <div class="modal-moment-msg">${escHtml(m.message || '—')}</div>
        </div>
        <span class="modal-moment-ts">${fmtTs(m.date)}</span>
      </div>`;
  }).join('');

  openModal(`
    <div class="modal-hdr">
      <div style="font-size:1.4rem;flex-shrink:0">${icon}</div>
      <div class="modal-hdr-body">
        <div class="modal-hdr-title">${escHtml(label)}</div>
        <div class="modal-hdr-sub">${filtered.length} ${filtered.length === 1 ? 'događaj' : 'događaja'} u sesiji</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">${rows}</div>
  `);
}

/* ── Utils ─────────────────────────────────────────────────────────── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s || '').replace(/'/g, '%27');
}

/* ── Event listeners ───────────────────────────────────────────────── */
yearSel.addEventListener('change', () => loadMeetings(yearSel.value));

meetingSel.addEventListener('change', () => {
  if (meetingSel.value) loadSessions(meetingSel.value);
});

sessionSel.addEventListener('change', () => {
  loadBtn.disabled = !sessionSel.value;
});

loadBtn.addEventListener('click', loadSession);

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Init ──────────────────────────────────────────────────────────── */
loadMeetings(yearSel.value);
</script>
