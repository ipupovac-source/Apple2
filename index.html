<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cindy the Snake — Apple II</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }

  /* Apple II monitor bezel */
  #monitor {
    background: #2a2a2a;
    border-radius: 24px;
    padding: 32px 40px 48px 40px;
    box-shadow:
      0 0 60px rgba(0,0,0,0.8),
      inset 0 2px 4px rgba(255,255,255,0.05);
    position: relative;
  }

  #monitor::after {
    content: "apple ][";
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #666;
    font-size: 14px;
    font-family: monospace;
    letter-spacing: 3px;
  }

  /* CRT screen area */
  #screen-wrap {
    background: #000;
    border-radius: 12px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
  }

  /* Scanline overlay */
  #screen-wrap::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* CRT curvature / glow */
  #screen-wrap::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(
      ellipse at center,
      transparent 60%,
      rgba(0,0,0,0.4) 100%
    );
    pointer-events: none;
    z-index: 11;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Phosphor glow effect */
  #game-canvas {
    filter: brightness(1.1);
  }
</style>
</head>
<body>

<div id="monitor">
  <div id="screen-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
